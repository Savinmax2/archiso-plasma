name: Build Arch Linux KDE ISO

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ISO inside Arch Linux Docker Container
        run: |
          docker run --privileged --rm \
            -v ${{ github.workspace }}:/workspace \
            archlinux:latest \
            /bin/bash -c "
              pacman-key --init && \
              pacman-key --populate archlinux && \
              pacman -Syu --noconfirm archiso && \
              mkarchiso -v -w /tmp/archiso-tmp -o /workspace/out /workspace/profile
            "

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: archlinux-kde-iso
          path: out/*.iso
